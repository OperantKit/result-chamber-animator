[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "result-chamber-animator"
version = "0.0.0"
description = "3D animation of recorded operant-chamber sessions. Consumes a CSV / JSONL session recording (step, chosen_response, is_reinforced columns) and renders chamber + agent + reinforcement events as PNG / MP4 / GIF."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "operantkit contributors" }]
dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.26",
    "pandas>=2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-cov",
]
dev = [
    "pytest>=8",
    "pytest-cov",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.scripts]
result-chamber-animator = "result_chamber_animator.cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/result_chamber_animator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "unit: pure-function unit tests",
    "integration: end-to-end / multi-component tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
